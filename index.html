<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>O Questionador — Mapa de Trilhas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-void:#05060b;
    --glass:rgba(255,255,255,.06);
    --glass-border:rgba(255,255,255,.12);
    --text-primary:#eef0f5;
    --text-secondary:#94a3b8;
    --accent: #8b9cf7;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse 60% 50% at 50% 0%, #12162a 0%, transparent 60%),
      radial-gradient(ellipse 80% 60% at 80% 100%, #10141f 0%, transparent 55%),
      var(--bg-void);
    color:var(--text-primary);
    font-family:'Inter',sans-serif;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  #stars{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;}
  #app{position:relative;width:100vw;height:100vh;z-index:1;}

  /* --- TELA DE AUTENTICAÇÃO (LOGIN / CADASTRO) --- */
  #authScreen {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(5, 6, 11, 0.75);
    backdrop-filter: blur(14px);
    transition: opacity 0.5s ease, visibility 0.5s;
  }
  
.auth-card {
    background: linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.02));
    border: 1px solid var(--glass-border);
    padding: 35px;
    border-radius: 22px;
    text-align: center;
    width: min(420px, 90vw);
    box-shadow: 0 0 50px -10px rgba(139, 156, 247, 0.2);
    animation: authFadeIn .5s cubic-bezier(.2,.9,.3,1.2) forwards;
}
  
  .auth-card h2 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 22px;
    margin: 0 0 6px;
  }
  
  .auth-card p {
    color: var(--text-secondary);
    font-size: 13.5px;
    margin: 0 0 24px;
  }
  
  .input-group {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 20px;
  }
  
  .input-group input {
    background: rgba(0, 0, 0, 0.4);
    border: 1px solid var(--glass-border);
    padding: 13px 16px;
    border-radius: 10px;
    color: var(--text-primary);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }
  
  .input-group input:focus { border-color: var(--accent); }
  .input-group input::placeholder { color: rgba(148, 163, 184, 0.4); }
  
  .btn-submit {
    width: 100%;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 14.5px;
    padding: 13px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    background: var(--text-primary);
    color: #05060b;
    transition: transform 0.2s, filter 0.2s;
  }
  .btn-submit:hover { transform: translateY(-1px); filter: brightness(0.9); }

  .auth-switch {
    margin-top: 18px;
    font-size: 13px;
    color: var(--text-secondary);
  }
  .auth-switch span {
    color: var(--accent);
    cursor: pointer;
    font-weight: 600;
  }
  .auth-switch span:hover { text-decoration: underline; }

  /* Feedback moderno (substitui o alert feio) */
  #authFeedback {
    margin-bottom: 15px;
    padding: 10px;
    border-radius: 8px;
    font-size: 13px;
    display: none;
  }
  .feedback-erro { background: rgba(239, 68, 68, 0.2); border: 1px solid rgba(239, 68, 68, 0.4); color: #fca5a5; }
  .feedback-sucesso { background: rgba(16, 185, 129, 0.2); border: 1px solid rgba(16, 185, 129, 0.4); color: #6ee7b7; }

  /* --- TOPBAR E TRILHAS --- */
  #topbar{
    position:absolute;top:0;left:0;right:0;
    display:flex;align-items:center;justify-content:space-between;
    padding:22px clamp(16px,4vw,40px);
    z-index:20;pointer-events:none;opacity:0;transition:opacity .8s ease;
  }
  #topbar *{pointer-events:auto;}
  #brand{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:15px;color:var(--text-secondary);}
  #brand b{color:var(--text-primary);font-weight:700;}

  #trail{display:flex;flex-wrap:wrap;align-items:center;gap:0;font-family:'Space Grotesk',sans-serif;font-size:13px;max-width:60vw;justify-content:flex-end;}
  .trail-node{display:flex;align-items:center;gap:8px;cursor:pointer;color:var(--text-secondary);transition:color .2s;white-space:nowrap;}
  .trail-node:hover{color:var(--text-primary);}
  .trail-node .dot{width:8px;height:8px;border-radius:50%;background:var(--dot,#555);box-shadow:0 0 10px var(--dot,#555);flex:none;}
  .trail-node.current{color:var(--text-primary);font-weight:600;}
  .trail-line{width:20px;height:1px;background:linear-gradient(90deg,rgba(255,255,255,.35),rgba(255,255,255,.05));margin:0 6px;flex:none;}

  #backBtn{
    position:absolute;left:clamp(16px,4vw,40px);bottom:26px;
    display:none;align-items:center;gap:8px;padding:10px 16px;border-radius:100px;
    background:var(--glass);border:1px solid var(--glass-border);color:var(--text-secondary);
    font-family:'Inter';font-size:13px;font-weight:500;cursor:pointer;backdrop-filter:blur(12px);
    z-index:20;transition:.2s;
  }
  #backBtn:hover{color:var(--text-primary);border-color:rgba(255,255,255,.25);}
  #backBtn svg{width:14px;height:14px;}

  #stage{position:absolute;inset:0;overflow:hidden;}

  .bubble{
    position:absolute;left:0;top:0;border-radius:50%;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
    cursor:pointer;background:var(--glass);border:1px solid var(--glass-border);
    backdrop-filter:blur(8px);will-change:transform;opacity:1;
    transition:opacity .35s ease, border-color .2s, background .2s, box-shadow .15s;
  }
  .bubble:hover{background:rgba(255,255,255,.12);border-color:var(--bc);box-shadow:0 0 40px -6px var(--bc);}
  .bubble.leaving{opacity:0;}
  .bubble.bounce-flash{box-shadow:0 0 40px 4px var(--bc);}
  .bubble .icon{font-size:var(--icon-size,24px);filter:drop-shadow(0 0 8px var(--bc));}
  .bubble .label{font-family:'Space Grotesk',sans-serif;font-weight:600;color:var(--text-primary);text-align:center;padding:0 12%;line-height:1.15;}

  #portal{
    position:fixed;border-radius:50%;pointer-events:none;z-index:15;
    background:var(--pc,#fff);opacity:0;transform-origin:center;
  }
  #portal.playing{
    transition:width .55s cubic-bezier(.6,0,.15,1), height .55s cubic-bezier(.6,0,.15,1),
                top .55s cubic-bezier(.6,0,.15,1), left .55s cubic-bezier(.6,0,.15,1), opacity .35s ease;
  }

  /* --- CARD DE TRILHA / QUIZ (ALTO CONTRASTE E LEGIBILIDADE) --- */
  #leafCard{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);
    width:min(520px, 90vw);padding:32px;border-radius:22px;
    background:rgba(15, 23, 42, 0.85);
    border:1px solid var(--glass-border);backdrop-filter:blur(16px);
    opacity:0;animation:fadeIn .4s cubic-bezier(.2,.9,.3,1.2) forwards;
    box-shadow:0 0 60px -10px var(--bc);
    text-align: left;
  }


  @keyframes authFadeIn {
    from {
        opacity: 0;
        transform: scale(.92) translateY(10px);
    }

    to {
        opacity: 1;
        transform: scale(1) translateY(0);
    }
}
  @keyframes fadeIn{to{opacity:1;transform:translate(-50%,-50%) scale(1);}}
  
  .quiz-alternativa {
    width: 100%;
    padding: 14px 18px;
    text-align: left;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.15);
    color: #ffffff !important; /* Força alta visibilidade */
    border-radius: 12px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    transition: all 0.2s;
  }
  .quiz-alternativa:hover {
    background: rgba(255, 255, 255, 0.12);
    border-color: var(--accent);
  }

  /* Botão de Transparência Algorítmica */
  .btn-transparencia {
    background: rgba(139, 156, 247, 0.15);
    border: 1px solid rgba(139, 156, 247, 0.3);
    color: var(--accent);
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    transition: 0.2s;
  }
  .btn-transparencia:hover { background: rgba(139, 156, 247, 0.25); }

  .transparencia-box {
    margin-top: 12px;
    padding: 12px;
    border-radius: 8px;
    background: rgba(139, 156, 247, 0.1);
    border-left: 3px solid var(--accent);
    font-size: 12.5px;
    color: #cbd5e1;
    line-height: 1.5;
  }

  .hidden { display: none !important; }
</style>
</head>
<body>

<canvas id="stars"></canvas>

<div id="app">
  
  <!-- TELA DE LOGIN / CADASTRO -->
  <div id="authScreen">
    <div class="auth-card">
      <div style="font-size: 32px; margin-bottom: 12px;">🎓</div>
      <h2 id="authTitle">O Questionador</h2>
      <p id="authSubtitle">Acesse a plataforma de Algoritmo Transparente</p>
      
      <div id="authFeedback"></div>

      <div class="input-group">
        <input type="email" id="emailInput" placeholder="E-mail acadêmico (ex: aluno@instituicao.edu.br)" autocomplete="off">
        <input type="password" id="senhaInput" placeholder="Sua senha secreta" autocomplete="off">
      </div>
      
      <button class="btn-submit" id="authBtn" onclick="executarAcaoAuth()">Acessar Trilhas</button>
      
      <div class="auth-switch">
        <span id="switchText" onclick="alternarModoAuth()">Não tem uma conta? Cadastre-se</span>
      </div>
    </div>
  </div>

  <div id="topbar">
    <div id="brand"><b>O Questionador</b> · mapa de trilhas</div>
    <div id="trail"></div>
  </div>

  <div id="stage"></div>

  <div id="backBtn" onclick="voltar()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    Voltar
  </div>

  <div id="portal"></div>
</div>

<script>
/* ---------------------------------------------------------
   DADOS DA ÁRVORE DE TRILHAS
--------------------------------------------------------- */
const DATA = [
  { id:'matematica', nome:'Matemática', icone:'🔢', cor:'#f5b95c',
    filhos:[
      { id:'algebra', nome:'Álgebra', icone:'➗' },
      { id:'geometria', nome:'Geometria', icone:'📐' },
      { id:'estatistica', nome:'Estatística', icone:'📊' }
    ]},
  { id:'portugues', nome:'Português', icone:'📚', cor:'#b48cf2',
    filhos:[
      { id:'gramatica', nome:'Gramática', icone:'✏️' },
      { id:'literatura', nome:'Literatura', icone:'🎭' },
      { id:'interpretacao', nome:'Interpretação', icone:'👁️' }
    ]},
  { id:'historia', nome:'História', icone:'📜', cor:'#e0785a',
    filhos:[
      { id:'hist-brasil', nome:'História do Brasil', icone:'🇧🇷', filhos:[
        { id:'colonia', nome:'Colônia', icone:'⛵' },
        { id:'imperio', nome:'Império', icone:'👑' },
        { id:'republica', nome:'República', icone:'🏛️' }
      ]},
      { id:'hist-geral', nome:'História Geral', icone:'🌍' }
    ]},
  { id:'geografia', nome:'Geografia', icone:'🗺️', cor:'#3ddc9b',
    filhos:[
      { id:'geo-fisica', nome:'Geo. Física', icone:'🌋' },
      { id:'geopolitica', nome:'Geopolítica', icone:'🏳️' },
      { id:'cartografia', nome:'Cartografia', icone:'🧭' }
    ]},
  { id:'ingles', nome:'Inglês', icone:'🗣️', cor:'#f26fa0',
    filhos:[
      { id:'vocab-en', nome:'Vocabulário', icone:'🔤' },
      { id:'gram-en', nome:'Gramática', icone:'📘' }
    ]},
  { id:'tecnologia', nome:'Tecnologia', icone:'💻', cor:'#8b9cf7',
    filhos:[
      { id:'etica', nome:'Ética e IA', icone:'⚖️', filhos:[
        { id:'privacidade', nome:'Privacidade', icone:'🔒' },
        { id:'vieses', nome:'Vieses Algorítmicos', icone:'🎯' },
      ]},
      { id:'programacao', nome:'Lógica de Prog.', icone:'⚙️' },
    ]},
];

const stage = document.getElementById('stage');
const trailEl = document.getElementById('trail');
const backBtn = document.getElementById('backBtn');
const portal = document.getElementById('portal');
const authScreen = document.getElementById('authScreen');
const topbar = document.getElementById('topbar');

let path = [];
let currentList = DATA;
let currentColor = null;
let bubbles = [];        
let animId = null;
let modoCadastro = false;

const TOP_MARGIN = 90, BOTTOM_MARGIN = 90, SIDE_MARGIN = 16;

/* ---------------------------------------------------------
   SISTEMA DE AUTENTICAÇÃO (LOGIN / CADASTRO)
--------------------------------------------------------- */
function alternarModoAuth() {
  modoCadastro = !modoCadastro;
  const title = document.getElementById('authTitle');
  const subtitle = document.getElementById('authSubtitle');
  const btn = document.getElementById('authBtn');
  const switchText = document.getElementById('switchText');
  document.getElementById('authFeedback').style.display = 'none';

  if(modoCadastro) {
    title.innerText = "Criar Nova Conta";
    subtitle.innerText = "Cadastre-se para registrar seu histórico de aprendizado";
    btn.innerText = "Cadastrar e Entrar";
    switchText.innerText = "Já tem uma conta? Faça login";
  } else {
    title.innerText = "O Questionador";
    subtitle.innerText = "Acesse a plataforma de Algoritmo Transparente";
    btn.innerText = "Acessar Trilhas";
    switchText.innerText = "Não tem uma conta? Cadastre-se";
  }
}

function mostrarFeedback(msg, tipo) {
  const fb = document.getElementById('authFeedback');
  fb.innerText = msg;
  fb.className = tipo === 'erro' ? 'feedback-erro' : 'feedback-sucesso';
  fb.style.display = 'block';
}

async function executarAcaoAuth() {
  const email = document.getElementById('emailInput').value.trim();
  const senha = document.getElementById('senhaInput').value.trim();

  if(!email || !senha) {
    mostrarFeedback("Por favor, preencha todos os campos.", "erro");
    return;
  }

  const endpoint = modoCadastro ? 'http://localhost:3000/api/cadastro' : 'http://localhost:3000/api/login';

  try {
    const resposta = await fetch(endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, senha })
    });

    const dados = await resposta.json();

    if (dados.success) {
      localStorage.setItem('id_usuario', dados.id_usuario);
      
      authScreen.style.opacity = '0';
      authScreen.style.visibility = 'hidden';
      topbar.style.opacity = '1';

      renderTrail();
      renderLevel(currentList);
    } else {
      mostrarFeedback(dados.message || "Erro na autenticação.", "erro");
    }
  } catch (error) {
    console.error("Erro:", error);
    mostrarFeedback("Servidor Node.js offline ou indisponível.", "erro");
  }
}

/* ---------------------------------------------------------
   FÍSICA DAS BOLHAS (COM DETECÇÃO DE COLISÃO ENTRE ELAS)
--------------------------------------------------------- */
function renderLevel(list){
  cancelAnimationFrame(animId);
  stage.innerHTML = '';
  bubbles = [];

  const w = stage.clientWidth, h = stage.clientHeight;
  const cx = w/2, cy = h/2;

  list.forEach((node)=>{
    const size = path.length===0 ? 118 : (node.filhos ? 108 : 100);
    const color = node.cor || currentColor || '#8b93a7';

    const el = document.createElement('div');
    el.className = 'bubble';
    el.style.setProperty('--bc', color);
    el.style.setProperty('--icon-size', path.length===0 ? '28px' : '22px');
    el.style.width = size+'px'; el.style.height = size+'px';
    el.innerHTML = `<div class="icon">${node.icone||'●'}</div><div class="label" style="font-size:${path.length===0?'13.5px':'12px'}">${node.nome}</div>`;
    el.addEventListener('click', ()=>irPara(node, el));
    stage.appendChild(el);

    const angle = Math.random()*Math.PI*2;
    const speed = 0.5 + Math.random()*0.15;
    bubbles.push({
      el,
      x: cx + (Math.random()*100 - 50), 
      y: cy + (Math.random()*100 - 50),
      vx: Math.cos(angle)*speed, 
      vy: Math.sin(angle)*speed,
      size, radius: size/2, spawn: performance.now()
    });
  });

  tick();
}

function tick(){
  const w = stage.clientWidth, h = stage.clientHeight;
  const now = performance.now();

  // 1. Atualiza posições e verifica colisões com as paredes
  bubbles.forEach(b=>{
    b.x += b.vx; b.y += b.vy;

    if(b.x <= SIDE_MARGIN){ b.x = SIDE_MARGIN; b.vx = Math.abs(b.vx); flash(b); }
    if(b.x + b.size >= w - SIDE_MARGIN){ b.x = w - SIDE_MARGIN - b.size; b.vx = -Math.abs(b.vx); flash(b); }
    if(b.y <= TOP_MARGIN){ b.y = TOP_MARGIN; b.vy = Math.abs(b.vy); flash(b); }
    if(b.y + b.size >= h - BOTTOM_MARGIN){ b.y = h - BOTTOM_MARGIN - b.size; b.vy = -Math.abs(b.vy); flash(b); }
  });

  // 2. Verifica colisão entre as bolhas (Física elástica simples / Repulsão)
  for(let i = 0; i < bubbles.length; i++) {
    for(let j = i + 1; j < bubbles.length; j++) {
      const b1 = bubbles[i];
      const b2 = bubbles[j];

      const c1x = b1.x + b1.radius;
      const c1y = b1.y + b1.radius;
      const c2x = b2.x + b2.radius;
      const c2y = b2.y + b2.radius;

      const dx = c2x - c1x;
      const dy = c2y - c1y;
      const distancia = Math.hypot(dx, dy);
      const somaRaios = b1.radius + b2.radius;

      if(distancia < somaRaios) {
        // Sobreposição detectada: inverte velocidades para afastá-las
        const tempVx = b1.vx;
        const tempVy = b1.vy;
        b1.vx = b2.vx;
        b1.vy = b2.vy;
        b2.vx = tempVx;
        b2.vy = tempVy;

        // Corrige o posicionamento imediato para evitar "grudamento"
        const overlap = somaRaios - distancia;
        const ajusteX = (dx / distancia) * (overlap / 2);
        const ajusteY = (dy / distancia) * (overlap / 2);
        b1.x -= ajusteX; b1.y -= ajusteY;
        b2.x += ajusteX; b2.y += ajusteY;
      }
    }
  }

  // 3. Aplica transformações visuais
  bubbles.forEach(b=>{
    const grow = Math.min(1, (now - b.spawn) / 420);
    const scale = grow<1 ? backEase(grow) : 1;
    b.el.style.transform = `translate(${b.x}px, ${b.y}px) scale(${scale})`;
  });

  animId = requestAnimationFrame(tick);
}

function backEase(t){  
  const c = 1.6;
  return 1 + c*Math.pow(t-1,3) + c*Math.pow(t-1,2);
}

function flash(b){
  if(b.flashing) return;
  b.flashing = true;
  b.el.classList.add('bounce-flash');
  setTimeout(()=>{ b.el.classList.remove('bounce-flash'); b.flashing=false; }, 260);
}

/* ---------------------------------------------------------
   TRANSIÇÕES E ZOOM NAS BOLHAS
--------------------------------------------------------- */
function irPara(node, bubbleEl){
  cancelAnimationFrame(animId);
  const rect = bubbleEl.getBoundingClientRect();
  const color = getComputedStyle(bubbleEl).getPropertyValue('--bc') || node.cor;

  bubbles.forEach(b=> b.el.classList.add('leaving'));

  portal.style.setProperty('--pc', node.cor || color);
  portal.style.width = rect.width+'px';
  portal.style.height = rect.height+'px';
  portal.style.left = rect.left+'px';
  portal.style.top = rect.top+'px';
  portal.style.opacity = '.9';
  portal.style.borderRadius = '50%';

  requestAnimationFrame(()=>{
    portal.classList.add('playing');
    const diag = Math.hypot(window.innerWidth, window.innerHeight);
    portal.style.width = diag*1.3+'px';
    portal.style.height = diag*1.3+'px';
    portal.style.left = (window.innerWidth/2 - diag*0.65)+'px';
    portal.style.top = (window.innerHeight/2 - diag*0.65)+'px';
  });

  setTimeout(()=>{
    path.push(node);
    currentColor = node.cor || currentColor;
    renderTrail();
    backBtn.style.display = 'flex';

    if(node.filhos && node.filhos.length){
      currentList = node.filhos;
      renderLevel(currentList);
    } else {
      mostrarLeaf(node);
    }

    setTimeout(()=>{
      portal.style.opacity = '0';
      portal.style.width = rect.width+'px';
      portal.style.height = rect.height+'px';
      portal.style.left = rect.left+'px';
      portal.style.top = rect.top+'px';
      setTimeout(()=>portal.classList.remove('playing'), 400);
    }, 60);
  }, 560);
}

function mostrarLeaf(node){
  cancelAnimationFrame(animId);
  stage.innerHTML = '';
  bubbles = [];
  const card = document.createElement('div');
  card.id = 'leafCard';
  card.style.setProperty('--bc', node.cor || currentColor);
  card.innerHTML = `
    <div style="font-size:28px; margin-bottom:12px;">${node.icone||'✦'}</div>
    <h2 style="font-family:'Space Grotesk'; font-size:20px; margin:0 0 8px;">${node.nome}</h2>
    <p style="color:var(--text-secondary); font-size:13.5px; line-height:1.5; margin:0 0 24px;">Trilha mapeada com base no seu perfil de aprendizado acadêmico.</p>
    <button onclick="iniciarPerguntas('${node.id}')" style="font-family:'Space Grotesk'; font-weight:600; font-size:14px; padding:12px 24px; border-radius:100px; border:none; cursor:pointer; background:var(--bc); color:#08090d; width:100%;">Iniciar Questão do Tópico</button>
  `;
  stage.appendChild(card);
}

/* ---------------------------------------------------------
   INTEGRAÇÃO COM O BACK-END (BUSCA DE QUESTÕES E EXIBIÇÃO)
--------------------------------------------------------- */
async function iniciarPerguntas(topicoId){
  try {
    const resposta = await fetch(`http://localhost:3000/api/questoes/${topicoId}`);
    const questoes = await resposta.json();

    if (questoes.length === 0) {
      stage.innerHTML = `
        <div id="leafCard">
          <h3 style="color:var(--accent); margin-top:0;">Tópico: ${topicoId.toUpperCase()}</h3>
          <p style="color:var(--text-secondary);">Ainda não há questões cadastradas neste tópico no banco MySQL.</p>
          <button onclick="voltar()" class="quiz-alternativa" style="margin-top:15px; text-align:center;">Voltar ao Mapa</button>
        </div>
      `;
      return;
    }

    const q = questoes[0];
    
    stage.innerHTML = `
      <div id="leafCard">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
          <span style="font-size:12px; font-weight:700; color:var(--accent); text-transform:uppercase;">Trilha: ${topicoId}</span>
          <!-- O DIFERENCIAL ÉTICO DO TCC -->
          <button class="btn-transparencia" onclick="toggleTransparencia()">👁️ Por que estou vendo esta pergunta?</button>
        </div>

        <div id="boxTransparencia" class="transparencia-box hidden">
          <strong>Algoritmo Transparente:</strong> O sistema selecionou esta questão de nível ${q.nivel_dificuldade} pois sua última avaliação neste tópico indicou necessidade de reforço conceitual.
        </div>

        <p style="font-size:15px; font-weight:600; color:#fff; margin: 15px 0 20px;">${q.enunciado}</p>
        
        <div style="display:flex; flex-direction:column; gap:10px; margin-bottom:15px;">
          <button class="quiz-alternativa" onclick="validarResposta('${q.alternativa_correta}', 'A', this)">A) ${q.alternativa_a}</button>
          <button class="quiz-alternativa" onclick="validarResposta('${q.alternativa_correta}', 'B', this)">B) ${q.alternativa_b}</button>
          <button class="quiz-alternativa" onclick="validarResposta('${q.alternativa_correta}', 'C', this)">C) ${q.alternativa_c}</button>
          <button class="quiz-alternativa" onclick="validarResposta('${q.alternativa_correta}', 'D', this)">D) ${q.alternativa_d}</button>
        </div>

        <div id="feedbackQuiz" style="display:none; padding:14px; border-radius:10px; background:rgba(0,0,0,0.5); margin-top:15px; border:1px solid rgba(255,255,255,0.1);">
          <p id="textoFeedback" style="margin:0 0 8px; font-weight:bold; font-size:14px;"></p>
          <p style="margin:0; font-size:13px; color:var(--text-secondary); line-height:1.4;"><strong>Justificativa pedagógica:</strong> ${q.justificativa}</p>
        </div>
      </div>
    `;
  } catch (error) {
    console.error("Erro ao buscar questões:", error);
    alert("Erro de comunicação com o servidor Node.js.");
  }
}

function toggleTransparencia() {
  const box = document.getElementById('boxTransparencia');
  box.classList.toggle('hidden');
}

function validarResposta(correta, escolhida, elemento) {
  // Desativa todos os botões após responder
  const botoes = document.querySelectorAll('.quiz-alternativa');
  botoes.forEach(b => b.style.pointerEvents = 'none');

  const feedback = document.getElementById('feedbackQuiz');
  const texto = document.getElementById('textoFeedback');
  
  feedback.style.display = 'block';
  if(escolhida === correta) {
    elemento.style.background = 'rgba(16, 185, 129, 0.35)';
    elemento.style.borderColor = '#10b981';
    texto.innerHTML = '✅ Resposta Correta!';
  } else {
    elemento.style.background = 'rgba(239, 68, 68, 0.35)';
    elemento.style.borderColor = '#ef4444';
    texto.innerHTML = '❌ Resposta Incorreta. A alternativa correta era a letra (' + correta + ').';
  }
}

function voltar(){
  if(path.length===0) return;
  path.pop();
  currentColor = path.length ? path[path.length-1].cor : null;
  currentList = path.length ? path[path.length-1].filhos : DATA;
  renderTrail();
  if(path.length===0) backBtn.style.display='none';
  renderLevel(currentList);
}

function renderTrail(){
  trailEl.innerHTML = '';
  const home = document.createElement('div');
  home.className = 'trail-node' + (path.length===0 ? ' current' : '');
  home.innerHTML = `<span class="dot" style="--dot:#8b93a7"></span> Início`;
  home.onclick = ()=>{ while(path.length) voltar(); };
  trailEl.appendChild(home);

  path.forEach((node,i)=>{
    const line = document.createElement('div'); line.className='trail-line';
    trailEl.appendChild(line);
    const el = document.createElement('div');
    el.className = 'trail-node' + (i===path.length-1 ? ' current':'');
    el.innerHTML = `<span class="dot" style="--dot:${node.cor||'#8b93a7'}"></span> ${node.nome}`;
    el.onclick = ()=>{ while(path.length>i+1) voltar(); };
    trailEl.appendChild(el);
  });
}

(function stars(){
  const c = document.getElementById('stars');
  const ctx = c.getContext('2d');
  function resize(){ c.width=innerWidth; c.height=innerHeight; }
  resize(); window.addEventListener('resize', resize);
  const pts = Array.from({length:110}, ()=>({
    x:Math.random()*innerWidth, y:Math.random()*innerHeight,
    r:Math.random()*1.3+.2, a:Math.random()*Math.PI*2
  }));
  function loop(t){
    ctx.clearRect(0,0,c.width,c.height);
    pts.forEach(p=>{
      const tw = .5 + .5*Math.sin(t/1000 + p.a);
      ctx.beginPath();
      ctx.fillStyle = `rgba(255,255,255,${.15+.35*tw})`;
      ctx.arc(p.x,p.y,p.r,0,7);
      ctx.fill();
    });
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
